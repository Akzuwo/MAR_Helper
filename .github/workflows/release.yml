name: Release Workflow
run-name: Release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versionsnummer, z. B. 1.2.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: mar-helper-release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  TAG: v${{ inputs.version }}
  INSTALLER_NAME: MAR-Helper-Setup-${{ inputs.version }}-x64.exe
  INSTALLER_URL: https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version }}/MAR-Helper-Setup-${{ inputs.version }}-x64.exe

jobs:
  windows-release:
    name: Windows GitHub Release
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $semverPattern = '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$'
          if ($env:VERSION -notmatch $semverPattern) {
            throw "Ungültige Version '$env:VERSION'. Erwartet wird SemVer, z. B. 1.2.3 oder 2.0.0-beta.1."
          }

          $defaultBranch = '${{ github.event.repository.default_branch }}'
          if ('${{ github.ref_name }}' -ne $defaultBranch) {
            throw "Releases müssen vom Default-Branch '$defaultBranch' gestartet werden. Ausgewählt wurde '${{ github.ref_name }}'."
          }

          $existingTag = git ls-remote --tags origin "refs/tags/$env:TAG"
          if ($existingTag) {
            throw "Der Tag '$env:TAG' existiert bereits. Es wird nichts überschrieben."
          }

          $encodedTag = [Uri]::EscapeDataString($env:TAG)
          $releaseUri = "https://api.github.com/repos/${{ github.repository }}/releases/tags/$encodedTag"
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'User-Agent' = 'MAR-Helper-Release-Workflow'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $releaseExists = $false
          try {
            Invoke-RestMethod -Method Get -Uri $releaseUri -Headers $headers | Out-Null
            $releaseExists = $true
          } catch {
            $statusCode = $_.Exception.Response.StatusCode
            if ($statusCode -ne [System.Net.HttpStatusCode]::NotFound) {
              throw "Der GitHub Release '$env:TAG' konnte nicht geprüft werden: $($_.Exception.Message)"
            }
          }
          if ($releaseExists) {
            throw "Der GitHub Release '$env:TAG' existiert bereits. Es wird nichts überschrieben."
          }

          if ($env:VERSION.Contains('-')) {
            'IS_PRERELEASE=true' >> $env:GITHUB_ENV
          } else {
            'IS_PRERELEASE=false' >> $env:GITHUB_ENV
          }

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set application version
        run: |
          npm version $env:VERSION --no-git-tag-version --allow-same-version

          $versionFile = 'src/shared/app-version.ts'
          $versionSource = Get-Content -LiteralPath $versionFile -Raw
          $updatedSource = [regex]::Replace(
            $versionSource,
            "APP_VERSION = '[^']+'",
            "APP_VERSION = '$env:VERSION'"
          )
          if ($updatedSource -eq $versionSource -and $versionSource -notmatch [regex]::Escape("APP_VERSION = '$env:VERSION'")) {
            throw "Die zentrale App-Version in '$versionFile' konnte nicht aktualisiert werden."
          }
          Set-Content -LiteralPath $versionFile -Value $updatedSource -Encoding utf8 -NoNewline

          $actualVersion = node -p "require('./package.json').version"
          if ($actualVersion -ne $env:VERSION) {
            throw "package.json enthält '$actualVersion' statt '$env:VERSION'."
          }

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Package NSIS installer
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm exec electron-builder -- --win nsis --publish never

      - name: Verify release assets
        run: |
          $installerPath = Join-Path 'release' $env:INSTALLER_NAME
          $requiredAssets = @(
            $installerPath,
            "$installerPath.blockmap",
            (Join-Path 'release' 'latest.yml')
          )
          foreach ($asset in $requiredAssets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Erwartetes Release-Asset fehlt: $asset"
            }
          }

      - name: Commit synchronized version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json src/shared/app-version.ts
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Release $env:VERSION"
            if ($LASTEXITCODE -ne 0) { throw 'Der Release-Commit konnte nicht erstellt werden.' }
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
            if ($LASTEXITCODE -ne 0) { throw 'Der Release-Commit konnte nicht auf den Default-Branch gepusht werden.' }
          } else {
            Write-Host 'Repository-Version ist bereits synchron; kein zusätzlicher Commit nötig.'
          }

      - name: Create and push release tag
        run: |
          git tag -a $env:TAG -m "MAR Helper $env:VERSION"
          if ($LASTEXITCODE -ne 0) { throw "Tag '$env:TAG' konnte nicht erstellt werden." }
          git push origin "refs/tags/$env:TAG"
          if ($LASTEXITCODE -ne 0) { throw "Tag '$env:TAG' konnte nicht gepusht werden." }

      - name: Create GitHub release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installerPath = Join-Path 'release' $env:INSTALLER_NAME
          $arguments = @(
            'release', 'create', $env:TAG,
            $installerPath,
            "$installerPath.blockmap",
            (Join-Path 'release' 'latest.yml'),
            '--verify-tag',
            '--title', "MAR Helper $env:VERSION",
            '--generate-notes'
          )
          if ($env:IS_PRERELEASE -eq 'true') {
            $arguments += '--prerelease'
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release '$env:TAG' konnte nicht erstellt werden." }

      - name: Verify published installer URL
        run: |
          $response = Invoke-WebRequest -Uri $env:INSTALLER_URL -Method Head
          if ($response.StatusCode -ne 200) {
            throw "Der Installer ist unter '$env:INSTALLER_URL' nicht erreichbar. HTTP $($response.StatusCode)."
          }

      - name: Write release summary
        if: always()
        run: |
          @"
          ## MAR Helper $env:VERSION

          - Tag: ``$env:TAG``
          - Release: https://github.com/${{ github.repository }}/releases/tag/$env:TAG
          - Installer: $env:INSTALLER_URL
          "@ >> $env:GITHUB_STEP_SUMMARY
